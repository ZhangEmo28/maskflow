name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/maskflow-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/maskflow-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: maskflow-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmaskflow-ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MASKFLOW_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=maskflow-ci;
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore maskflow-api.tests/MaskFlow.Api.Tests.csproj
      - run: dotnet test maskflow-api.tests/MaskFlow.Api.Tests.csproj --configuration Release --no-restore

  python:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai/sam-inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m compileall -q app
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
